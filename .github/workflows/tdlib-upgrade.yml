name: tdlib-upgrade

# Builds TDLib native JNI libraries for Android from the official upstream
# source and opens a PR with the resulting artifacts. Trigger manually after
# the tdlib-release-check workflow reports a newer release.

on:
  workflow_dispatch:
    inputs:
      # Pinned to the exact upstream commit recorded as
      # `Pinned source commit` in docs/TDLIB_ARTIFACT_MANIFEST.md. This is the
      # commit `TdApi.java` was generated from and that `armeabi-v7a/libtdjni.so`
      # was built from, so pinning it keeps all three ABIs and the Java bindings on
      # one schema.
      #
      # The previous default was `master`. `build-tdlib-android.sh` defaults
      # TDLIB_REF to master as well, so a run that did not pass a ref produced
      # libraries from a moving branch while the bindings stayed on the pinned
      # commit — which is exactly how arm64-v8a and x86_64 ended up on 1.8.67 while
      # TdApi.java and armeabi-v7a stayed on 1.8.66 (see
      # docs/maintenance/TDLIB_VERSION_DECISION.md).
      #
      # To move to a newer TDLib deliberately: change this default AND
      # `expected_version` in the same commit, after the version-decision analysis
      # has been redone for the new commit. Never point this at a branch.
      ref:
        description: "TDLib upstream commit to build (full 40-char SHA). Never a branch: a moving ref desynchronises the native libraries from TdApi.java."
        required: false
        default: "022d60202e446ad1287b9fb68e687c8a0760788b"
        type: string
      expected_version:
        description: "Exact version to assert against the cloned source (build-tdlib-android.sh aborts if it disagrees)."
        required: false
        default: "1.8.66"
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: tdlib-upgrade
  cancel-in-progress: false

jobs:
  build:
    name: Build TDLib ${{ inputs.ref }} for Android
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      TARGET_ABIS: arm64-v8a armeabi-v7a x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -yq gperf php-cli ninja-build wget unzip

      - name: Install Android NDK + CMake
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" \
            "ndk;26.3.11579264" "cmake;3.22.1"
          test -x "$ANDROID_HOME/ndk/26.3.11579264/ndk-build"
          test -x "$ANDROID_HOME/cmake/3.22.1/bin/cmake"
          test -x "$ANDROID_HOME/cmake/3.22.1/bin/ninja"
          echo "NDK + CMake installed under $ANDROID_HOME"

      - name: Export SDK paths
        run: |
          set -euo pipefail
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmake/3.22.1/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmake/3.22.1/bin/cmake" --version | head -n 1
          "$ANDROID_HOME/cmake/3.22.1/bin/ninja" --version

      - name: Build OpenSSL shared libraries (per ABI)
        env:
          FORCE_ALL_ABIS: "1"
        run: ./scripts/build-openssl-android.sh

      - name: Assert the ref is a pinned commit, not a branch
        run: |
          set -euo pipefail
          REF="${{ inputs.ref }}"
          if ! [[ "$REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::TDLIB_REF must be a full 40-char commit SHA, got '$REF'." >&2
            echo "A branch or tag is a moving target: it desynchronises the native" >&2
            echo "libraries from TdApi.java, which is the defect this workflow caused." >&2
            exit 1
          fi
          echo "Pinned TDLib commit: $REF"

      - name: Build TDLib ${{ inputs.ref }} (JNI + Java bindings)
        env:
          TDLIB_REF: ${{ inputs.ref }}
          TDLIB_VERSION: ${{ inputs.expected_version }}
          TDLIB_NATIVE_BUILD_DIR: ${{ github.workspace }}/.native-build
        run: ./scripts/build-tdlib-android.sh

      # Hard 16 KB gate. check-tdlib-artifacts.sh already fails when any PT_LOAD
      # segment is below 0x4000 (TDLIB_CHECK_ABI=all covers all three ABIs), so this
      # step restates it as a named, greppable failure and prints the evidence.
      # The build keeps alignment via the linker flags in
      # scripts/build-tdlib-android.sh
      # (-Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384, required because
      # NDK r27 and older do not default to 16 KB ELF alignment) on NDK
      # 26.3.11579264. Do not remove those flags; NDK r28+ defaults to 16 KB and the
      # flags are harmless there, but nothing here runs r28.
      - name: Verify 16 KB ELF alignment for every ABI
        run: |
          set -euo pipefail
          failed=0
          for abi in $TARGET_ABIS; do
            f="data/src/main/jniLibs/$abi/libtdjni.so"
            if [ ! -f "$f" ]; then
              echo "::error file=$f::missing libtdjni.so for $abi" >&2
              failed=1
              continue
            fi
            aligns=""
            if command -v readelf >/dev/null 2>&1; then
              aligns=$(readelf -lW "$f" 2>/dev/null | awk '/[[:space:]]LOAD[[:space:]]/{print $NF}')
            elif command -v llvm-readelf >/dev/null 2>&1; then
              aligns=$(llvm-readelf -lW "$f" 2>/dev/null | awk '/[[:space:]]LOAD[[:space:]]/{print $NF}')
            else
              echo "::error::no ELF reader (readelf/llvm-readelf) available; cannot verify 16 KB alignment" >&2
              exit 1
            fi
            if [ -z "$aligns" ]; then
              echo "::error file=$f::no PT_LOAD segments readable; cannot verify 16 KB alignment" >&2
              failed=1
              continue
            fi
            bad=""
            for v in $aligns; do
              case "$v" in
                0x*) if (( 16#${v#0x} < 16384 )); then bad="$bad $v"; fi ;;
                *)   echo "::error file=$f::unparseable alignment token '$v'" >&2; failed=1 ;;
              esac
            done
            if [ -n "$bad" ]; then
              echo "::error file=$f::$abi is NOT 16 KB aligned (segments below 0x4000:$bad)" >&2
              failed=1
            else
              echo "✅ $abi: LOAD segments 16 KB aligned ($(echo $aligns | tr '\n' ' '))"
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "16 KB alignment gate FAILED — refusing to publish these artifacts." >&2
            exit 1
          fi
          echo "16 KB alignment gate passed for: $TARGET_ABIS"

      - name: Verify artifacts (checksums, architecture, alignment)
        run: ./scripts/check-tdlib-artifacts.sh
        env:
          TDLIB_CHECK_ABI: all

      - name: Summarize artifacts
        if: always()
        run: |
          echo "## TDLib v${TDLIB_VERSION:-unknown} artifacts (ref: ${{ inputs.ref }})" >> "$GITHUB_STEP_SUMMARY"
          for abi in $TARGET_ABIS; do
            f="data/src/main/jniLibs/$abi/libtdjni.so"
            if [ -f "$f" ]; then
              size=$(wc -c < "$f")
              echo "- ✅ $abi: libtdjni.so ($size bytes)" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- ❌ $abi: libtdjni.so missing" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Create upgrade branch + commit
        run: |
          set -euo pipefail
          BRANCH="tdlib/v${TDLIB_VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add data/src/main/jniLibs data/src/main/java/org/drinkless/tdlib/TdApi.java \
                  data/src/main/java/org/drinkless/tdlib/Client.java \
                  docs/TDLIB_ARTIFACT_MANIFEST.md docs/TDLIB_SHA256SUMS.txt
          if git diff --cached --quiet; then
            echo "No artifact changes — aborting PR creation." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          git commit -m "chore: upgrade TDLib to v${TDLIB_VERSION} (native rebuild)"
          git push origin "$BRANCH"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"

      - name: Open PR (best-effort)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Written to a file rather than interpolated inline: a heredoc inside
          # "$( ... )" swallows the command's exit status, so a rejected
          # create-PR call would red the job and leave the pushed branch with no
          # link for a human to follow.
          cat > /tmp/pr-body.md <<'EOF'
          Automated TDLib upgrade produced by the tdlib-upgrade workflow.

          ## Contents
          - Rebuilt libtdjni.so for arm64-v8a, armeabi-v7a, x86_64 from official upstream source
          - Regenerated TdApi.java + refreshed Client.java Java bindings
          - Rebuilt OpenSSL shared libraries per ABI (official 3.0.16 source)
          - Updated docs/TDLIB_ARTIFACT_MANIFEST.md and docs/TDLIB_SHA256SUMS.txt

          ## Required before merge (docs/TDLIB_UPDATE_POLICY.md)
          - [ ] Real device authentication test
          - [ ] Real upload smoke test on emulator/device
          - [ ] Review check-tdlib-artifacts.sh output in workflow logs

          Refs the automated TDLib release check issue.
          EOF
          # Repositories may deny "create a pull request" to GITHUB_TOKEN, and
          # that policy is not ours to change: treat the PR step as best-effort
          # and hand the operator the branch's compare URL instead of failing.
          if gh pr create \
            --title "chore: upgrade TDLib to v${TDLIB_VERSION} (native rebuild)" \
            --body-file /tmp/pr-body.md \
            --base main \
            --head "$BRANCH"; then
            echo "## TDLib upgrade PR opened in CI" >> "$GITHUB_STEP_SUMMARY"
          else
            PR_URL="https://github.com/${GITHUB_REPOSITORY}/pull/new/${BRANCH}"
            echo "Automatic PR creation is not permitted for this repository (GitHub Actions create-PR policy)." >&2
            echo "## Open the upgrade PR manually" >> "$GITHUB_STEP_SUMMARY"
            echo "Branch \`${BRANCH}\` is pushed and ready: ${PR_URL}" >> "$GITHUB_STEP_SUMMARY"
          fi
