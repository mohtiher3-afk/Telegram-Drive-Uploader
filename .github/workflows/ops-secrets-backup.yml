name: ops-secrets-backup
on:
  push:
    branches: [ops/secrets-backup]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Write secrets to files
        env:
          AIHUBMIX_API_KEY: ${{ secrets.AIHUBMIX_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENCODE_ZEN_API_KEY: ${{ secrets.OPENCODE_ZEN_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          set -euo pipefail
          mkdir -p secr
          for n in AIHUBMIX_API_KEY GEMINI_API_KEY GH_PERSONAL_ACCESS_TOKEN \
                   GROQ_API_KEY OPENCODE_ZEN_API_KEY OPENROUTER_API_KEY \
                   RELEASE_KEYSTORE_BASE64 RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD \
                   RELEASE_STORE_PASSWORD TELEGRAM_API_HASH TELEGRAM_API_ID \
                   TELEGRAM_BOT_TOKEN TELEGRAM_CHANNEL_ID; do
            v="${!n}"
            if [ -z "$v" ]; then echo "MISSING:$n"; exit 1; fi
            printf '%s' "$v" > "secr/$n"
          done
          tr -d '[:space:]' < secr/RELEASE_KEYSTORE_BASE64 | base64 --decode > secr/release.keystore
          echo "written: $(ls secr | wc -l) files"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: secrets-backup
          path: secr/
          retention-days: 1
          if-no-files-found: error
