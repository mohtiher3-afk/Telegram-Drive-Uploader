name: Android Multi-ABI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build Android ${{ matrix.abi }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64]
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;26.3.11579264"

      - name: Prepare official OpenSSL runtime dependencies
        env:
          TARGET_ABIS: ${{ matrix.abi }}
        run: ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/26.3.11579264" ./scripts/build-openssl-android.sh

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare CI configuration
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          printf 'TELEGRAM_API_ID=%s\n' "${TELEGRAM_API_ID:-0}" > .env
          printf 'TELEGRAM_API_HASH=%s\n' "${TELEGRAM_API_HASH:-placeholder_hash}" >> .env
          keytool -genkeypair \
            -keystore debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Verify official TDLib artifacts
        run: ./scripts/check-tdlib-artifacts.sh

      - name: Run JVM unit tests
        run: gradle --no-daemon --max-workers=2 :app:testDebugUnitTest

      - name: Run release lint
        run: gradle --no-daemon --max-workers=2 :app:lintVitalRelease

      - name: Build debug APK for selected ABI
        run: gradle --no-daemon --max-workers=1 -PtargetAbi=${{ matrix.abi }} :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: telegram-drive-uploader-${{ matrix.abi }}-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Remove local CI files
        if: always()
        run: rm -f .env debug.keystore local.properties
