name: Android Multi-ABI Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v1.0.2'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build signed ${{ matrix.abi }} APK
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64]
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;26.3.11579264"

      - name: Prepare official OpenSSL runtime dependencies
        env:
          TARGET_ABIS: ${{ matrix.abi }}
        run: ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/26.3.11579264" ./scripts/build-openssl-android.sh

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Telegram configuration
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          printf 'TELEGRAM_API_ID=%s\n' "${TELEGRAM_API_ID:-0}" > .env
          printf 'TELEGRAM_API_HASH=%s\n' "${TELEGRAM_API_HASH:-placeholder_hash}" >> .env

      - name: Prepare Release signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          test -n "$RELEASE_STORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          test -n "$RELEASE_KEY_PASSWORD"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$GITHUB_WORKSPACE/release.keystore"
          chmod 600 "$GITHUB_WORKSPACE/release.keystore"
          keytool -list \
            -keystore "$GITHUB_WORKSPACE/release.keystore" \
            -storepass "$RELEASE_STORE_PASSWORD" \
            -alias "$RELEASE_KEY_ALIAS" > /dev/null

      - name: Verify official TDLib artifacts
        env:
          TDLIB_CHECK_ABI: ${{ matrix.abi }}
        run: ./scripts/check-tdlib-artifacts.sh

      - name: Run JVM unit tests
        run: gradle --no-daemon --max-workers=2 :app:testDebugUnitTest

      - name: Run release lint
        run: gradle --no-daemon --max-workers=2 :app:lintVitalRelease

      - name: Build signed Release APK for selected ABI
        env:
          RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          gradle --no-daemon --max-workers=1 \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" \
            -PtargetAbi=${{ matrix.abi }} \
            :app:assembleRelease

      - name: Verify APK and create checksum
        run: |
          ABI="${{ matrix.abi }}"
          APK="app/build/outputs/apk/release/app-${ABI}-release.apk"
          test -f "$APK"
          unzip -l "$APK" | grep -q "lib/${ABI}/libtdjni.so"
          if unzip -l "$APK" | grep -Eq "lib/(arm64-v8a|armeabi-v7a|x86_64)/libtdjni.so" | grep -v "lib/${ABI}/libtdjni.so"; then
            echo "Unexpected additional ABI library found in $ABI APK"
            exit 1
          fi
          sha256sum "$APK" | tee "apk-${ABI}-sha256.txt"

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "app/build/outputs/apk/release/app-${{ matrix.abi }}-release.apk"

      - name: Upload signed ABI release artifact
        uses: actions/upload-artifact@v4
        with:
          name: telegram-drive-uploader-${{ matrix.abi }}-release
          path: |
            app/build/outputs/apk/release/app-${{ matrix.abi }}-release.apk
            apk-${{ matrix.abi }}-sha256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Remove sensitive build files
        if: always()
        run: rm -f .env release.keystore local.properties

  publish:
    name: Publish multi-ABI GitHub Release
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - name: Download all signed ABI artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: telegram-drive-uploader-*-release
          path: release-assets
          merge-multiple: true

      - name: Flatten release assets
        run: |
          mkdir -p release-assets-flat
          find release-assets -type f -exec cp {} release-assets-flat/ \;

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}"
          name: "Telegram Drive Uploader ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}"
          generate_release_notes: true
          files: release-assets-flat/*
