name: Android ARM64 Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v1.0.2'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish ARM64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare build configuration
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          {
            printf 'TELEGRAM_API_ID=%s\n' "${TELEGRAM_API_ID:-0}"
            printf 'TELEGRAM_API_HASH=%s\n' "${TELEGRAM_API_HASH:-placeholder_hash}"
          } > .env
          keytool -genkeypair \
            -keystore debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Verify official TDLib artifacts
        run: ./scripts/check-tdlib-artifacts.sh

      - name: Run unit tests
        run: gradle --no-daemon --max-workers=2 :app:testDebugUnitTest

      - name: Run release lint
        run: gradle --no-daemon --max-workers=2 :app:lintVitalRelease

      - name: Build Release APK
        run: |
          gradle --no-daemon --max-workers=1 \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" \
            :app:assembleRelease

      - name: Verify and checksum APK
        run: |
          APK="app/build/outputs/apk/release/app-arm64-v8a-release.apk"
          test -f "$APK"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libtdjni.so'
          if unzip -l "$APK" | grep -Eq 'lib/(armeabi-v7a|x86|x86_64)/'; then
            echo "Unexpected non-ARM64 native library found"
            exit 1
          fi
          sha256sum "$APK" | tee apk-sha256.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}
          name: Telegram Drive Uploader ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/app-arm64-v8a-release.apk
            apk-sha256.txt

      - name: Remove local build secrets
        if: always()
        run: rm -f .env debug.keystore local.properties
