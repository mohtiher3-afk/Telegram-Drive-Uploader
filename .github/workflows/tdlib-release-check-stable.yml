name: TDLib upstream check

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: tdlib-release-check
  cancel-in-progress: true

jobs:
  check:
    name: Check upstream TDLib version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Check latest TDLib upstream version
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const source = fs.readFileSync('docs/TDLIB_ARTIFACT_MANIFEST.md', 'utf8');
            const versionMatch = source.match(/\|\s*Version\s*\|\s*`v?(\d+\.\d+\.\d+)`\s*\|/i)
              || source.match(/TDLib\s+v(\d+\.\d+\.\d+)/i);
            if (!versionMatch) core.setFailed('Could not determine pinned TDLib version from docs/TDLIB_ARTIFACT_MANIFEST.md');
            const pinned = versionMatch?.[1];

            const response = await fetch('https://raw.githubusercontent.com/tdlib/td/master/CMakeLists.txt');
            if (!response.ok) {
              throw new Error(`Failed to read upstream TDLib CMakeLists.txt: ${response.status} ${response.statusText}`);
            }
            const cmake = await response.text();
            const latestMatch = cmake.match(/project\s*\(\s*TDLib\s+VERSION\s+(\d+\.\d+\.\d+)/i);
            if (!latestMatch) {
              throw new Error('Could not parse TDLib VERSION from upstream CMakeLists.txt');
            }
            const latest = `v${latestMatch[1]}`;

            const compareVersions = (left, right) => {
              const a = left.replace(/^v/, '').split('.').map(Number);
              const b = right.replace(/^v/, '').split('.').map(Number);
              for (let i = 0; i < Math.max(a.length, b.length); i++) {
                const difference = (a[i] ?? 0) - (b[i] ?? 0);
                if (difference !== 0) return difference;
              }
              return 0;
            };
            const newer = compareVersions(latest, pinned) > 0;

            core.setOutput('pinned', pinned);
            core.setOutput('latest', latest);
            core.setOutput('newer', String(newer));
            if (!newer) {
              core.info(`No newer TDLib upstream version. pinned=${pinned}, latest=${latest}`);
              return;
            }

            const title = `[tdlib] New TDLib master snapshot ${latest} available`;
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'dependencies', per_page: 100
            });
            if (existing.some(issue => issue.title === title)) {
              core.info(`Issue already exists: ${title}`);
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo, title,
              body: `A newer TDLib master snapshot is available upstream.\n\n- Upstream master: ${latest}\n- Pinned: ${pinned}\n- Source: https://github.com/tdlib/td/blob/master/CMakeLists.txt`
            });
